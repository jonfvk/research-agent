[project]
name = "research-agent"
version = "0.1.0"
description = "Daily trend research and separate-repository AI project builder"
requires-python = ">=3.10"
dependencies = [
    "keyring>=25,<26",
    "truststore>=0.9,<1.0",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
research-agent = "research_agent.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
